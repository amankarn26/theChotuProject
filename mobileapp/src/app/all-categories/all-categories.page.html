<ion-header>
  <ion-toolbar style="--background: rgba(134,75,246,1);">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="" (click)="cancel()" style="color: white;">
      </ion-back-button>
    </ion-buttons>

    <ion-row>
      <ion-col size="10">
        <ion-title class="pageheading" style="color: white;margin-top: 10px;"> <strong
            style="color: white;">{{title}}</strong></ion-title>
      </ion-col>
      <ion-col size="2">
        <button ion-button (click)="openCart()" class="notification-icon-button"
          style="margin-top: 3px; font-size: 31px;background-color:#864bf6; color:#ffffff;">
          <ion-badge class="notification-badge" *ngIf="cart.length">{{cart?.length}}</ion-badge>
          <!-- <ion-icon slot="icon-only" name="cart" ></ion-icon> -->
          <ion-icon name="cart-outline"></ion-icon>
        </button>

      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-header>

<ion-toolbar style="color: #ffffff;background-color: aqua;">
  <ion-segment (ionChange)="segmentChanged()" [(ngModel)]='segment' style="color: #ffffff;">
    <!-- <ion-segment-button value="today">Today</ion-segment-button> -->
    <ion-segment-button value="FOOD" style="color: #ffffff;">FOOD</ion-segment-button>
    <ion-segment-button value="DRINKS" style="color: #ffffff;">DRINKS</ion-segment-button>
  </ion-segment>
</ion-toolbar>



<ion-content>


  <ion-list *ngFor="let item of filteredItems ; let i=index">

    <!-- list -->
    <ion-item (click)="changebutton(item.id,item.name)" > 
      <ion-thumbnail slot="start" class="search">

        <img src="{{docServer}}/{{item.photo?.docpath}}" alt="foodname"
          style="width: 60px; height: 60px; border-radius: 10px">

      </ion-thumbnail>
      <ion-label>
        <p class="item-name">{{item.name}}</p>
        <p class="item-detail">
          <!-- <span>{{item.description | slice: 0:50 }}</span> -->
        </p>
      </ion-label>
    </ion-item>


  </ion-list>


</ion-content>
