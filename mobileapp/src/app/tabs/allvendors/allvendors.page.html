<ion-header>
  <ion-toolbar class="new-background-color">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1">
      </ion-back-button>
    </ion-buttons>

    <ion-title class="pageheading"> <strong>{{title}}</strong></ion-title>
    <ion-buttons class="cartt" slot="end" >
      <ion-button class="cartt" (click)="openCart()" style="--ackground: transparent !important;">
        <ion-badge class="bd" *ngIf="cart.length>0">{{cart.length}}</ion-badge>
        <ion-icon name="cart" slot="icon-only" style="color: black; " ></ion-icon>
      </ion-button>
     </ion-buttons>
  </ion-toolbar>
</ion-header>



<ion-content>
  <ion-searchbar (ionInput)="getItems($event)" placeholder="{{'Search Shop'}}">
  </ion-searchbar>
  <ion-list *ngFor="let item of filteredItems ; let i=index ">
      <ion-item>
        <ion-thumbnail slot="start">
          <a [routerLink]="['/tabs/popularshop', item.category, item.id, item.name]">
          <img src="{{docServer}}/{{item?.logo?.docpath}}" alt="foodname" style="width: 60px; height: 60px; border-radius: 10px" >
        </a>
        </ion-thumbnail>
        <ion-label> <p class="item-name">{{item.name}}</p>
          <p class="item-detail" text-wrap>
              <span>{{item.description | slice: 0:50 }}</span>
          </p></ion-label>
      </ion-item>
  </ion-list>

</ion-content>
