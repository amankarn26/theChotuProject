<div [hidden]="isManageState" class="col-md-12 col-sm-12 col-xs-12">

  <div class="panel panel-default">
    <div class="panel-heading">
      {{subtitle}}
      <a [routerLink]="['/managefirm']" title="View all firms" class="pull-right">
        <span class="glyphicon glyphicon-th-list"></span>
      </a>
    </div>
    <div class="panel-body">
       <form #form1="ngForm" >
        <div class="col-sm-6">
          <div class="form-group">
            <label for="name"> Name:
            </label>
            <input type="text" class="form-control" required name="name" [(ngModel)]="firm.name">
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-group">
            <label for="regno"> Registration no:</label>
            <input type="text" class="form-control" name="regno" [(ngModel)]="firm.regno">
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-group">
            <label for="phone"> Phone:</label>
            <input type="number" class="form-control"
             name="phone" pattern="[0-9]{10}" [(ngModel)]="firm.phone">
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-group">
            <label for="email"> Email:
            </label>
            <input type="email" class="form-control" name="email" required [(ngModel)]="firm.email">
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-group">
            <label for="empcount"> Member Count:</label>
            <input type="number" class="form-control" name="empcount" [(ngModel)]="firm.empcount">
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="line1">Address Line 1:
            </label>
            <input type="text" class="form-control" id="line1" name="line1" [(ngModel)]="firm.address.line1" required />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="line2">Area</label>
            <input type="text" class="form-control" id="line2" name="line2" required [(ngModel)]="firm.address.line2" />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="pincode">Pin-Code:
            </label>
            <input type="number" class="form-control" id="pincode" name="pincode" [(ngModel)]="firm.address.pincode" required pattern="[0-9]{5}"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="states">State:
            </label>
            <select class="form-control" name="states" [(ngModel)]="firm.address.states" required (change)="onChangeState($event)">
              <option *ngFor="let state of statelist; let i=index" [value]="state.state_name">{{state.state_name}}</option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="city">City:
            </label>
            <select (ngModel)="citiName" name="citiName" class="form-control" required [(ngModel)]="firm.address.city">
              <option *ngFor="let city of citylist; let i=index" [value]="city.city_name">{{city.city_name}}</option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <button *ngIf="this.url == '/addfirm'" type="submit" [disabled]="!form1.valid" class="btn btn-default" (click)="submitData()">Submit</button>
            <button *ngIf="this.url == '/editfirm/' + this.id" type="submit" [disabled]="!form1.valid" class="btn btn-default" (click)="updateData()">Update</button>
           <button type="button" class="btn btn-default" (click)="cancel()">Cancel</button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>
