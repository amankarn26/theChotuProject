<div class="panel panel-default slideLeft" *ngIf="flag">
    <div class="panel-heading">
        <div class="clearfix">
            <div class="pull-left"> {{title}}</div>
            <div class="container" class="pull-right">
              <div class="row">
               <!-- <a [routerLink]="['/addrole']" class="btn btn-primary  btn-sm a-btn-slide-text" title="Add Role">
                      <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                      <span></span>
                  </a>
                <a href="#" class="btn btn-default a-btn-slide-text" title="Edit">
                      <span class="glyphicon glyphicon-edit" aria-hidden="true"></span>
                      <span></span>
                  </a>
                <a href="#" class="btn btn-info btn-sm a-btn-slide-text" title="View">
                      <span class="glyphicon glyphicon-eye-open" aria-hidden="true"></span>
                      <span></span>
                  </a>
                <a href="#" class="btn btn-danger a-btn-slide-text btn-sm" title="Delete">
                      <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
                      <span></span>
                  </a>-->
                <a [routerLink]="['/managerole']" title="Manage Role" class="btn btn-info btn-sm a-btn-slide-text" >
                    <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span></a>
              </div>
            </div>
          </div>

    </div>
    <div class="panel-body">
      <form #fname="ngForm" >
        <div class="col-md-6 col-sm-6 col-xs-12">
          <div class="form-group" >
            <label for="role">Role:</label>

            <input type="text" class="form-control"  id="role" name="role" [(ngModel)]="user.role" #role="ngModel" minlength="4" required
            />
          <div *ngIf="role.invalid && (role.dirty || role.touched)"
                    class="alert alert-danger">

                <div *ngIf="role.errors.required">
                  Name is required.
                </div>
                <div *ngIf="role.errors.minlength">
                  Name must be at least 4 characters long.
                </div>
                <div *ngIf="role.errors.forbiddenName">
                  Name cannot be Bob.
                </div>
                <div *ngIf="role.errors.pattern">
                    Match the pattern
                  </div>
              </div>
          </div>
       </div>
       <div class="col-md-6 col-sm-6 col-xs-12">
          <div class="form-group">
            <label for="description">Description : </label>
          <input type="text" mutiline class="form-control" id="description" name="description" [(ngModel)]="user.description"  minlength="4"/>
          </div>
        </div>
        <div class="col-md-12">
          <div class="form-group">
            <button type="submit" class="btn btn-default" [disabled]="!fname.valid" (click)="submitData()">Submit</button>
           <button type="button" class="btn btn-default" (click)="cancel()">Cancel</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="panel panel-default slideLeft" *ngIf="!flag">
    <div class="panel-heading">
        <div class="clearfix">
            <div class="pull-left"> {{title}}</div>
            <div class="container" class="pull-right">
              <div class="row">
                <!-- <a [routerLink]="['/addrole']" class="btn btn-primary  btn-sm a-btn-slide-text" title="Add Role">
                      <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                      <span></span>
                  </a> -->
                <!-- <a href="#" class="btn btn-default a-btn-slide-text" title="Edit">
                      <span class="glyphicon glyphicon-edit" aria-hidden="true"></span>
                      <span></span>
                </a>
                <a href="#" class="btn btn-info btn-sm a-btn-slide-text" title="View">
                      <span class="glyphicon glyphicon-eye-open" aria-hidden="true"></span>
                      <span></span>
                  </a>
                <a href="#" class="btn btn-danger a-btn-slide-text btn-sm" title="Delete">
                      <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
                      <span></span>
                  </a>
                <a [routerLink]="['/managerole']" title="Manage Role" class="btn btn-info btn-sm a-btn-slide-text" >
                    <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span></a> -->
              </div>
            </div>
          </div>

    </div>
    <div class="panel-body">
      <div class="col-md-12 col-sm-12 col-xs-12">
          <div class="table-responsive">
              <table class="table table-condensed table-striped table-bordered" [mfData]="data | dataFilterPr : filterQuery" #mf="mfDataTable"
                [mfRowsOnPage]="rowsOnPage"  >
                <thead>
                  <tr>
                    <th>SN</th>
                    <th>
                      <mfDefaultSorter by="role">Rolee</mfDefaultSorter>
                    </th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let data of data; let i = index;">
                    <td>{{i+1}}</td>
                    <td>{{data.role}}</td>
                    <td>{{data.description}}</td>

                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <td colspan="4">
                      <mfBootstrapPaginator [rowsOnPageSet]="[5,10,15]"></mfBootstrapPaginator>
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>

      </div>
    </div>
  </div>
