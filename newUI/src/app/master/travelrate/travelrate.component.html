            </select>

          <div class=" col-sm-3 ">
              <div class="form-group">
                <label for="custstate">Destination State:
                </label>
                  <input *ngIf="isUpdate"  class="form-control" name="custstate" [(ngModel)]="custstate" />
                <select *ngIf="!isUpdate" class="form-control" name="custstate" required [(ngModel)]="custstate"
                  (change)="onChangeState($event)">
                  <option *ngFor="let state of statelist; let i=index" [value]="state">{{state}}</option>
                </select>


              </div>
            </div>
            <div class=" col-sm-3 ">
              <div class="form-group">
                <label for="destcity">Destination City:

                </label>
                <input *ngIf="isUpdate"  name="destcity" class="form-control" [(ngModel)]="trate.destcity" />
                <select *ngIf="!isUpdate" (ngModel)="citiName" name="destcity"  class="form-control" [(ngModel)]="trate.destcity"
                  (change)="getClienList()">
                  <option *ngFor="let city of citylist; let i=index" [value]="city">{{city}}</option>
                </select>
              </div>
            </div>

        <div class="col-md-6 col-sm-6 col-xs-12">
          <div class="form-group">
            <label for="minwt">Min Weight:</label>
            <input type="number" class="form-control" id="minwt" name="minwt" required [(ngModel)]="trate.minwt" />
          </div>
        </div>

        <div class="col-md-6 col-sm-6 col-xs-12">
          <div class="form-group">
            <label for="maxwt">Max Weight:</label>
            <input type="number" class="form-control" id="maxwt" name="maxwt" required [(ngModel)]="trate.maxwt" />
          </div>
        </div>

    <div class="col-md-6 col-sm-6 col-xs-12">
      <div class="form-group">
        <label for="rateunit"> Rate unit:
        </label>
        <!-- <input type="number" class="form-control" required name="rateunit" [(ngModel)]="product.rateunit"> -->
        <select class="form-control" id="rateunit" *ngIf="!isUpdate" required name="rateunit" [(ngModel)]="trate.rateunit">
          <option value="RATEPER1000">RATE PER 1000</option>
          <option value="RATEPERPACK">RATE PER PACK</option>
          <option value="RATEPERPRODUCT">RATE PER PRODUCT</option>
          <option value="RATEPERDOZEN">RATE PER DOZEN</option>
          <option value="RATEPERKG">RATE PER KG</option>


        </select>
        <select class="form-control" id="rateunit" *ngIf="isUpdate" required name="rateunit" [(ngModel)]="trate.rateunit" disabled>
          <option value="RATEPER1000">RATE PER 1000</option>
          <option value="RATEPERPACK">RATE PER PACK</option>
          <option value="RATEPERPRODUCT">RATE PER PRODUCT</option>
          <option value="RATEPERDOZEN">RATE PER DOZEN</option>
          <option value="RATEPERKG">RATE PER KG</option>


        </select>

      </div>
    </div>

        <div class="col-md-6 col-sm-6 col-xs-12">
          <div class="form-group">
            <label for="rateperunit">Rate Per Unit:</label>
            <input type="number" class="form-control" id="rateperunit" name="rateperunit" required [(ngModel)]="trate.rateperunit" />
          </div>
        </div>




        <div class="col-md-6">
          <div class="form-group">
            <button *ngIf="this.url == '/addtravelrate'" type="submit" [disabled]="!form1.valid" class="btn btn-default" (click)="submitData()">Submit</button>
            <button *ngIf="this.url == '/edittravelrate/' + this.id" type="submit" [disabled]="!form1.valid" class="btn btn-default" (click)="updateData()">Update</button>
           <button type="button" class="btn btn-default" (click)="cancel()">Cancel</button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>
