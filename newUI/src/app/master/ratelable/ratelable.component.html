  <div [hidden]="isManageState" class="col-md-12 col-sm-12 col-xs-12 text-capitalize">

    <div class="panel panel-default" *ngIf="!detailFlag">
      <div class="panel panel-default">
        <div class="panel-heading">
          {{title}}
          <a [routerLink]="['/manageratelabel']" title="Manage RateLabel" class="pull-right">
            <span class="glyphicon glyphicon-th-list"></span>
          </a>
        </div>
        <div class="panel-body" *ngIf="tab1">
           <form #form1="ngForm" >


            <div class="col-sm-6">
              <div class="form-group">
                <label for="label"> Label:
                </label>
                <input type="text" *ngIf="!isUpdate" class="form-control"  name="label" required [(ngModel)]="ratelabel.label">
                <input type="text" *ngIf="isUpdate" readonly  class="form-control"  name="label" required [(ngModel)]="ratelabel.label" >
              </div>
            </div>
            <div class="col-sm-6">
              <div class="form-group">
                <label for="description"> Description:
                </label>
                <input type="text" *ngIf="!isUpdate" class="form-control" name="description" [(ngModel)]="ratelabel.description">
                <input type="text" *ngIf="isUpdate"  class="form-control" name="description" [(ngModel)]="ratelabel.description">

              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group">
                <button *ngIf="this.url == '/addratelabel'" type="submit" [disabled]="!form1.valid" class="btn btn-default" (click)="submitData()">Submit</button>
                <button *ngIf="this.url == '/editratelabel/' + this.id" type="submit" [disabled]="!form1.valid" class="btn btn-default" (click)="updateData()">Update</button>
               <button type="button" class="btn btn-default" (click)="cancel()">Cancel</button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>

    <div class="panel panel-default" *ngIf="detailFlag">
      <div class="panel-heading">
        <div class="clearfix">
          <div class="pull-left"> {{title}}</div>
          <div class="container" class="pull-right">
            <div class="row">
              <a [routerLink]="['/manageratelabel']" title="Manage RateLabel" class="btn btn-info btn-sm a-btn-slide-text">
                <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
              </a>

              <a [routerLink]="['/editratelabel', id]" title="Update RateLabel" class="btn btn-info btn-sm a-btn-slide-text">

                <i class="glyphicon glyphicon-edit"></i>

              </a>
              <a class="btn btn-danger a-btn-slide-text btn-sm"  title="Delete RateLabel"   (click)="deleteRole(id)">
                <span class="glyphicon glyphicon-remove-circle"></span>
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-body">

        <form #form1="ngForm">
          <div class="col-md-12 col-sm-12 col-xs-12 ">

            <!-- <div class="col-md-12 col-sm-12 col-xs-12">
              <h4>RateLabel Details:</h4>
            </div> -->

            <div class="col-md-6 col-sm-6 col-xs-12">
              <div class="col-md-12 col-sm-12 col-xs-12">
                <div class="form-group">
                  <label for="label">Label: {{ratelabel.label}}</label>
                </div>
              </div>
              <div class="col-md-12 col-sm-12 col-xs-12">
                <div class="form-group">
                  <label for="description">Description: {{ratelabel.description}}
                  </label>
                </div>
              </div>

              <!-- <div class="col-md-6 col-sm-6 col-xs-12">

                  </label>
                </div>
              </div> -->
            </div>
          </div>





        </form>

      </div>
    </div>


  </div>
