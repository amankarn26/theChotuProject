<!-- add event -->
<div [hidden]="isManageState" class="col-md-12 col-sm-12 col-xs-12">

    <div class="panel panel-default">
        <div class="panel-heading">
            {{title}}
            <a [routerLink]="['/manageadvertisement']" title="Manage Advertisement" class="pull-right">
                <span class="glyphicon glyphicon-th-list"></span>
            </a>
        </div>
        
        <div class="panel-body">
            <form #form1="ngForm">

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="customer">Customer Name: </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="customer"
                            [(ngModel)]="advertisement.customer">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="customer"
                            [(ngModel)]="advertisement.customer">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="advtfor"> Advertisement For: </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="advtfor"
                            [(ngModel)]="advertisement.advtfor">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="advtfor"
                            [(ngModel)]="advertisement.advtfor">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="contactinfo"> Contact Information: </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="contactinfo"
                            [(ngModel)]="advertisement.contactinfo">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="contactinfo"
                            [(ngModel)]="advertisement.contactinfo">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="typeofadvt"> Type Of Advertisement: </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="typeofadvt"
                            [(ngModel)]="advertisement.typeofadvt">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="typeofadvt"
                            [(ngModel)]="advertisement.typeofadvt">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="position"> Position: </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="position"
                            [(ngModel)]="advertisement.position">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="position"
                            [(ngModel)]="advertisement.position">
                    </div>
                </div>

<!-- manage event -->
<div [hidden]="!isManageState" class="col-md-12 col-sm-12 col-xs-12">

    <div class="panel panel-default">
        <div class="panel-heading">
            {{title}}
            <!-- Button for Add Category -->
            <a [routerLink]="['/addadvertisement']" title="Add Advertisement" class="pull-right" *ngIf="this.userRole == 'SUPERADMIN' && this.userType == 'FIRM'">
                  <span class="glyphicon glyphicon-plus-sign"></span>
              </a>
        </div>

        <div class="panel-body">
            <div class="table-responsive">
                <table class="table table-condensed table-striped table-bordered"
                    [mfData]="data | dataFilterPr : filterQuery: 'manageevent'" #mf="mfDataTable"
                    [mfRowsOnPage]="rowsOnPage" [(mfSortBy)]="Role" [(mfSortOrder)]="sortOrder">
                    <thead>
                        <tr>
                            <th>SN</th>
                            <th>
                                <mfDefaultSorter by="role">Customer Name</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Advertisement For</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Contact Information</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Type of Advertisement</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Position</mfDefaultSorter>
                            </th>
                            <!-- <th>Description</th> -->
                            <th *ngIf="this.userRole==='SUPERADMIN' && this.userType==='FIRM'"
                                (click)="deleteRole(data.id)">Action
                            </th>
                        </tr>
                        <tr>
                            <th colspan="8">
                                <div id="custom-search-input">
                                    <div class="input-group col-md-12">
                                        <input type="text" class="form-control" placeholder="Search by name"
                                            [(ngModel)]="filterQuery" />
                                        <span class="input-group-btn">
                                            <button class="btn btn-danger btn-sm" type="button">
                                                <span class=" glyphicon glyphicon-search"></span>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let data of mf.data; let i = index; let last = last;">
                            <td>{{i+1}}</td>
                            <td>
                                <div class="img-thumbnail">
                                    <img  src="{{docServer}}/{{data?.photo?.docpath}}"
                                        class="img-circle" alt="" style="width:100px; height:100px;">
                                    <img *ngIf="!data?.photo?.docpath"
                                        src="https://sainfoinc.com/wp-content/uploads/2018/02/image-not-available.jpg"
                                        class="img-circle" alt="" style="width:100px; height:100px;">

                                    <div class="caption text-capitalize text-center"> {{data?.name}}</div>
                                </div>
                            </td>
                            <td>{{data?.location}}</td>
                            <td>{{data?.fromdate | date}} </td>
                            <td>{{data?.todate | date}} </td>
                            <td>{{data?.description}}</td>

                            <!-- <td>{{data?.description}}</td> -->

                            <td class="text-right" *ngIf="this.userRole==='SUPERADMIN' && this.userType==='FIRM'"
                                (click)="deleteRole(data.id)">
                                <a [routerLink]="['/editadvertisement/',data.id]" data-toggle="tooltip"
                                    title="Update Advertisement ">
                                    <button class="btn btn-default btn-sm">
                                        <span class="glyphicon glyphicon-edit"></span>
                                    </button>
                                </a>
                                <button class="btn btn-danger btn-sm" title="Delete Event"
                                    *ngIf="this.userRole==='SUPERADMIN' && this.userType==='FIRM'"
                                    (click)="deleteRole(data.id)">
                                    <span class="glyphicon glyphicon-remove-circle"></span>
                                </button>

                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="8">
                                <mfBootstrapPaginator [rowsOnPageSet]="[5,10,15]"></mfBootstrapPaginator>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
