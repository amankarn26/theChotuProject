                <p>Some text in the modal.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- add offer -->
<div [hidden]="isManageState" class="col-md-12 col-sm-12 col-xs-12">

    <div class="panel panel-default">
        <div class="panel-heading">
            {{title}}
            <a [routerLink]="['/managediscount']" title="Manage Hotdeals" class="pull-right">
                <span class="glyphicon glyphicon-th-list"></span>
            </a>
        </div>

        <div class="panel-body">
            <form #form1="ngForm">

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="name"> Name:
                        </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="name"
                            [(ngModel)]="discount.name">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="name"
                            [(ngModel)]="discount.name">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="couponcode"> Coupon Code:

                        </label>
                        <input type="text" *ngIf=!isUpdate class="form-control" required name="couponcode"
                            [(ngModel)]="discount.couponcode">
                        <input type="text" *ngIf=isUpdate class="form-control" required name="couponcode"
                            [(ngModel)]="discount.couponcode">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="discount"> Discount:

                        </label>
                        <input type="number" *ngIf=!isUpdate class="form-control" required name="discount"
                            [(ngModel)]="discount.discount">
                        <input type="number" *ngIf=isUpdate class="form-control" required name="discount"
                            [(ngModel)]="discount.discount">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="validtill"> Valid Till:

                        </label>
                        <input type="date" *ngIf=!isUpdate class="form-control" required name="validtill"
                            [valueAsDate]="setDate" (change)="updateDate($event)">
                        <input type="date" *ngIf=isUpdate class="form-control" required name="validtill"
                            [(ngModel)]="discount.validtill">
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="form-group">
                        <label for="minvalue"> Minimum Value:

                        </label>
                        <input type="number" *ngIf=!isUpdate class="form-control" required name="minvalue"
                            [(ngModel)]="discount.minvalue">
                        <input type="number" *ngIf=isUpdate class="form-control" required name="minvalue"
                            [(ngModel)]="discount.minvalue">
                    </div>
                </div>


                <div class="col-md-12 col-sm-12 col-xs-12 ">
                    <hr>
                    <div class="col-md-12 col-sm-12 col-xs-12">
                        <h4 for="photo">Photo:</h4>
                    </div>
                    <div class="col-md-6 col-sm-6 col-xs-12">
                        <div class="form-group">
                            <label>Photo (Maximum size 500Kb):</label>
                            <input required type="file" (change)="fileEvent($event)" *ngIf=!isUpdate name="document"
                                [(ngModel)]="document" />
                            <input type="file" (change)="fileEvent($event)" *ngIf=isUpdate name="document"
                                [(ngModel)]="document" />

                        </div>
                    </div>
                    <div class="col-md-6 col-sm-6 col-xs-12">
                        <img [src]="docurll" style="height:200px; width:200px;" class="thumbnail">
                    </div>
                </div>

                <!-- button -->
                <div class="col-md-12">
                    <div class="form-group">
                        <button *ngIf="this.url == '/adddiscount'" type="submit" [disabled]="!form1.valid"
                            class="btn btn-default" (click)="submitData()" style="margin-right: 10px;">Submit</button>
                        
                        <button *ngIf="this.url == '/editdiscount/' + this.id" type="submit" [disabled]="!form1.valid"
                            class="btn btn-default" (click)="updateData()" style="margin-right: 10px;">Update</button>
                        
                        <button type="button" class="btn btn-default" (click)="cancel()" >Cancel</button>

                    </div>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- manage offers -->
<div [hidden]="!isManageState" class="col-md-12 col-sm-12 col-xs-12">

    <div class="panel panel-default">
        <div class="panel-heading">
            {{title}}
            <a [routerLink]="['/adddiscount']" title="Add Discount" class="pull-right"
                *ngIf="this.userRole == 'SUPERADMIN' && this.userType == 'FIRM'">
                <span class="glyphicon glyphicon-plus-sign"></span>
            </a>
        </div>

        <div class="panel-body">
            <div class="table-responsive">
                <table class="table table-condensed table-striped table-bordered"
                    [mfData]="data | dataFilterPr : filterQuery: 'managediscount'" #mf="mfDataTable"
                    [mfRowsOnPage]="rowsOnPage" [(mfSortBy)]="Role" [(mfSortOrder)]="sortOrder">
                    <thead>
                        <tr>
                            <th>SN</th>
                            <th>
                                <mfDefaultSorter by="role">Name</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Coupon Code</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Discount</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Min Value</mfDefaultSorter>
                            </th>
                            <th>
                                <mfDefaultSorter by="role">Valid Till</mfDefaultSorter>
                            </th>
                            <th *ngIf="this.userRole==='SUPERADMIN' && this.userType==='FIRM'"
                                (click)="deleteRole(data.id)">Action
                            </th>
                        </tr>
                        <tr>
                            <th colspan="8">
                                <div id="custom-search-input">
                                    <div class="input-group col-md-12">
                                        <input type="text" class="form-control" placeholder="Search By Name"
                                            [(ngModel)]="filterQuery" />
                                        <span class="input-group-btn">
                                            <button class="btn btn-danger btn-sm" type="button">
                                                <span class=" glyphicon glyphicon-search"></span>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let data of mf.data; let i = index; let last = last;">
                            <td>{{i+1}}</td>
                            <td>
                                <div class="img-thumbnail">
                                    <img src="{{docServer}}/{{data?.photo?.docpath}}" class="img-circle" alt=""
                                        style="width:100px; height:100px;">
                                    <img *ngIf="!data?.photo?.docpath"
                                        src="https://sainfoinc.com/wp-content/uploads/2018/02/image-not-available.jpg"
                                        class="img-circle" alt="" style="width:100px; height:100px;">

                                    <div class="caption text-capitalize text-center"> {{data?.name}}</div>
                                </div>
                            </td>
                            <td>{{data?.couponcode}}</td>
                            <td>{{data?.discount}}</td>
                            <td>{{data?.minvalue}} /-</td>
                            <td>{{data?.validtill | date}} </td>
                            <!-- <td>{{item.bdatetime * 1000 | date:'dd-MM-yy'}}</td> -->
                            <!-- <td>{{data?.validtill}} </td> -->


                            <!-- <td>{{data?.description}}  </td> -->

                            <td class="text-right" *ngIf="this.userRole==='SUPERADMIN' && this.userType==='FIRM'"
                                (click)="deleteRole(data.id)">
                                <a [routerLink]="['/editdiscount/',data.id]" data-toggle="tooltip"
                                    title="Update Discount">
                                    <button class="btn btn-default btn-sm">
                                        <span class="glyphicon glyphicon-edit"></span>
                                    </button>
                                </a>
                                <button class="btn btn-danger btn-sm" title="Delete Discount"
                                    *ngIf="this.userRole==='SUPERADMIN' && this.userType==='FIRM'"
                                    (click)="deleteRole(data.id)">
                                    <span class="glyphicon glyphicon-remove-circle"></span>
                                </button>

                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="8">
                                <mfBootstrapPaginator [rowsOnPageSet]="[5,10,15]"></mfBootstrapPaginator>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
