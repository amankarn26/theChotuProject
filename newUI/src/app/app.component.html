<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

<div class="wrapper" *ngIf="loginStatus">
    <app-menu></app-menu>

    <div class="main-panel">
        <nav class="navbar navbar-default navbar-fixed" style="color: #fff !important;background-color: #b08d57;">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle" data-toggle="collapse"
                        data-target="#navigation-example-2">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a *ngIf="this.userrole === 'SUPERADMIN'" [routerLink]="['/adminhome']"
                        class="navbar-brand">Dashboard</a>
                    <a *ngIf="this.userrole === 'CUSTOMER'" [routerLink]="['/custhomepage']"
                        class="navbar-brand">Dashboard</a>

                    <a *ngIf="this.userrole === 'FIRM'" [routerLink]="['/vendorhomepage']"
                        class="navbar-brand">Dashboard</a>

                    <a *ngIf="this.userrole === 'DELIVERY_PERSON'" [routerLink]="['/delivery_dashboard']"
                        class="navbar-brand">Dashboard</a>

                </div>

                <div class="collapse navbar-collapse">
                    <ul class="nav navbar-nav navbar-left">
                        <li class="dropdown">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                                <i class="glyphicon glyphicon-bell"></i>
                                <span class="notification"
                                    *ngIf="this.notificationlist?.length > 0">{{this.notificationlist?.length}}</span>
                                <b class="caret hidden-lg hidden-md"></b>
                                <p class="hidden-lg hidden-md">
                                    5 Notifications
                                    <b class="caret"></b>
                                </p>
                            </a>
                            <ul class="dropdown-menu">

                                <span style=" font-size: 13px; cursor: pointer; " class="label label-primary pull-right"
                                    *ngIf="!this.notificationlist?.length">No Notifications !!</span>
                                <span style=" font-size: 13px; cursor: pointer; " class="label label-danger pull-right"
                                    *ngIf="this.notificationlist?.length > 0" (click)="clearnotify()">Clear All
                                    Notifications</span>
                                <li *ngFor="let data of notificationlist">
                                    <a><span class="dot"></span> &nbsp;<b>{{data.message}}</b></a>
                                </li>

                            </ul>
                        </li>
                        <li>
                        </li>
                    </ul>

                    <ul class="nav navbar-nav navbar-right">
                        <li>
                            <a>Welcome {{username}}</a>
                        </li>

                        <li>
                            <a (click)="logoutApp()" href="">
                                <p>Log out</p>
                            </a>
                        </li>
                        <li class="separator hidden-lg"></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="content">

            <router-outlet></router-outlet>

        </div>


        <footer class="footer">
            <div class="container-fluid">
                <p class="copyright pull-right">
                    &copy;
                    <script>document.write(new Date().getFullYear())</script> <a href="http://softwiders.com">Softwiders Pvt. Ltd.</a>, made with love for a better web
                </p>
            </div>
        </footer>
    </div>
</div>

<div class="wrapper pnkj" *ngIf="!loginStatus">
    <router-outlet></router-outlet>
</div>
