    

<div class="panel panel-default slideLeft" *ngIf="flag">
  <div class="panel-heading">
    <div class="clearfix">
      <div class="pull-left"> {{title}}</div>
      <div class="container" class="pull-right">
        <div class="row">
         
          <a [routerLink]="['/managerlabel']" title="Manage Rate Label" class="btn btn-info a-btn-slide-text">
                    <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
          </a>
        </div>
      </div>
    </div>

  </div>
  <div class="panel-body">
    <form #fname="ngForm">
       
      <div class="col-md-6 col-sm-6 col-xs-12"  >
        <div class="form-group">
          <label for="label">Label: </label>
          <input *ngIf="!isUpdate" type="text"  class="form-control" id="label" name="label" [(ngModel)]="ratelabel.label"  (input) ="inputValidator($event)" required maxlength="20"
          />
          <input *ngIf="isUpdate" type="text" readonly class="form-control" id="label" name="label" [(ngModel)]="ratelabel.label"
          />
        </div>
      </div>
          
      <div class="col-md-6 col-sm-6 col-xs-12"  >
        <div class="form-group">
          <label for="description">Description: </label>
          <input *ngIf="!isUpdate" type="text"  class="form-control" id="description" name="description" [(ngModel)]="ratelabel.description"
          />
          <input *ngIf="isUpdate" type="text"  class="form-control" id="description" name="description" [(ngModel)]="ratelabel.description"
          />
        </div>
      </div>
      <div class="col-md-12">
        <div class="form-group">
          <button *ngIf="!isUpdate" type="submit" class="btn btn-default" [disabled]="!fname.valid" (click)="submitData()">Submit</button>
          <button *ngIf="isUpdate" type="submit" class="btn btn-default" [disabled]="!fname.valid" (click)="updateData()">Update</button>
          <button type="button" class="btn btn-default" (click)="cancel()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
