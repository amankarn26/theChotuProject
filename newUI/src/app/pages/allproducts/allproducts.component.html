<div class="col-md-12 col-sm-12 col-xs-12 text-capitalize" *ngIf="this.route.url === '/all_products'">
    <div class="panel panel-default">
      <div class="panel-heading">
        <!-- All Products ;&nbsp;&nbsp;&nbsp;&nbsp;Total Products = {{tp}} -->

        All Products
        <div class="container" class="pull-right">
            <div class="row">
  
              <a  title="Home" [routerLink]="['/custhomepage']"   class="btn btn-info btn-sm">
                <span class="glyphicon glyphicon-home" aria-hidden="true"></span>
              </a>
              <a [routerLink]="['/mycart']" class="btn btn-success btn-sm" style="color: white;left: 650%;">
                <i class="fa fa-shopping-cart"></i> &nbsp;
                <span class="badge badge-light">{{this.items.length}}</span>
              </a>&nbsp;
              <a (click)="cancel()" title="Back" class="btn btn-info btn-sm">
                <span class="glyphicon glyphicon-step-backward" aria-hidden="true"></span>
              </a>
            </div>
        </div>

      </div>

      <div class="panel-body">
        <div class="table-responsive">
          <table class="table table-condensed table-striped table-bordered"
            [mfData]="data | dataFilterPr : filterQuery:'fproduct'" #mf="mfDataTable" [mfRowsOnPage]="rowsOnPage"
            [(mfSortBy)]="Role" [(mfSortOrder)]="sortOrder">
           
            <thead>
              <tr>
                <th colspan="10">
                  <div id="custom-search-input">
  
                    <div class="col-sm-12">
                      <div class="col-md-6 col-sm-6 col-xs-12">
                        <div class="form-group" >
                          <label for="gender"> Search by
                            </label>&nbsp;                              
                          <input type="radio" value="Customdate"  [(ngModel)]="prodtypeselect"  name="prodtypeselect" > Product Type &nbsp; 
                        </div>
                      </div>
                    </div>
  
                    <div class="col-sm-12" *ngIf="prodtypeselect">
                          <div class="col-sm-3"  >
                            <div class="form-group">
                              <label for="prodtype"> Product type:
                              </label>
                              <select class="form-control" *ngIf="!isUpdate" id="prodtype" required name="prodtype"
                                [(ngModel)]="prodtype" (change)="getprodbyprodtype()">
                                <option required *ngFor="let type of prodtlist; let i=index" [value]="type.name">{{type.name}}</option>
                              </select>
  
                            </div>
                          </div>
  
                          <div class="col-sm-3">
                            <div class="form-group">
                              <label for="state">Reset :
                              </label>
                              <span class="input-group-btn">
                                <button   class="btn btn-info btn-sm" title="Reset" (click)="refreshincall()" style="font-size: 9px;">
                                  <span class="glyphicon glyphicon-refresh"></span>
                                </button>
                                </span>
                            </div>
                        </div>
                    </div>
               
                  </div>
                </th>
              </tr>

              <tr>
                <th>SN</th>             
                <!-- <th>ID</th> -->
                <th>Name</th>             
                <th>Type</th>
                <th>HSN Code</th>
                <th>Rate unit</th>
                <th>Action</th>
              </tr>

              <tr>
                <th colspan="18">
                  <div id="custom-search-input">
                    <div class="input-group col-md-12">
                      <input type="text" class="form-control" placeholder="Search by name, category or type"
                        [(ngModel)]="filterQuery" />
                      <span class="input-group-btn">
                        <button class="btn btn-danger btn-sm" type="button">
                          <span class=" glyphicon glyphicon-search"></span>
                        </button>
                      </span>
                    </div>
                  </div>
                </th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let data of data; let i = index; let last = last;">
                <td>{{i+1}}</td>
                <!-- <td>{{data?.id}}</td> -->
                <!-- <td>{{data?.name}}</td> -->
                <td>
                  <div class="img-thumbnail  ">
                    <img *ngIf="data?.path" src="{{docServer}}/{{data?.path}}" class="img-circle" alt="" style="width:200px; height:200px;">
                    <img *ngIf="!data?.path" src="https://sainfoinc.com/wp-content/uploads/2018/02/image-not-available.jpg" class="img-circle" alt="" style="width:200px; height:200px;">
  
                    <div class="caption text-capitalize text-center"> {{data?.name}}</div>
                  </div>
                </td>
               
                <td>{{data?.prodtype}}</td>
                <td>{{data?.hsncode}}</td>
                <td>
  
              
                <p *ngIf="data.rateunit==='RATEPERKG'">Rate Per KG</p>
                <p *ngIf="data.rateunit==='RATEPERPRODUCT'">Rate Per Product</p>
               <p *ngIf="data.rateunit==='RATEPERDOZEN'">Rate Per Dozen</p>
              <p *ngIf="data.rateunit==='RATE_PER_PKT'">Rate Per Packet</p>
              <p *ngIf="data.rateunit==='RATE_PER_CRATE'">Rate Per Crate</p>
              <p *ngIf="data.rateunit==='RATE_PER_LITRE'">Rate Per Litre</p>
                </td>
              
                <td style=" width: 10px; ">
  
                
                    <a style=" margin: 111px;" [routerLink]="['/productdetails',data.id]" class="btn btn-info">
                        <span class="glyphicon glyphicon-shopping-cart"></span> Add to Cart
                      </a>
                 
                
                </td>
              </tr>
            </tbody>

            <tfoot>
              <tr>
                <td colspan="21">
                  <mfBootstrapPaginator [rowsOnPageSet]="[5,10,15]"></mfBootstrapPaginator>
                </td>
              </tr>
            </tfoot>
          </table>
        
        </div>
      </div>
    </div>
</div>
